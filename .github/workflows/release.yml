name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[packaging,dev,desktop]"
      - name: Run the test suite before shipping anything
        # `QT_QPA_PLATFORM=offscreen` so the desktop tests run on a machine with no
        # display; they are the tests that matter most here, because the frozen window is
        # the artifact most likely to break in a way the CLI cannot show.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build the command line
        run: pyinstaller packaging/nocdeck-cli.spec
      - name: Build the desktop window
        run: pyinstaller packaging/nocdeck-desktop.spec
      - name: Rename the artifacts with the version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          # `nocdeck-cli-…` and `nocdeck-desktop-…`, never `nocdeck-…`: a glob of
          # `nocdeck-*` would match both on Linux and the smoke test would run the
          # windowed binary by accident (which is how this was found).
          cp dist/nocdeck.exe "out/nocdeck-cli-${version}-windows.exe"
          cp dist/nocdeck-desktop.exe "out/nocdeck-desktop-${version}-windows.exe"
      - name: Smoke-test the frozen command line
        shell: bash
        env:
          NOCDECK_HOME: ${{ runner.temp }}\nocdeck-cli-smoke
        run: |
          ./out/nocdeck-cli-*.exe version
          ./out/nocdeck-cli-*.exe list
          ./out/nocdeck-cli-*.exe summary
      - name: Smoke-test the frozen window
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          NOCDECK_HOME: ${{ runner.temp }}\nocdeck-desktop-smoke
        run: |
          # `Start-Process` gives this windowed executable **no console** — exactly what a
          # person double-clicking the download gets. Launching it from a shell is not the
          # same test: a shell hands over its console and a build that dies before its
          # window appears looks perfectly healthy. So: run it the way the user does, but
          # with `--shot`, which draws one frame, writes a PNG and exits by itself.
          $exe = Get-ChildItem out/nocdeck-desktop-*.exe | Select-Object -First 1
          $frame = Join-Path $env:RUNNER_TEMP 'frame.png'
          Write-Host "launching $($exe.Name)"
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList '--demo','--shot',$frame,'--size','3','--warmup','2' -PassThru
          if (-not $proc.WaitForExit(90000)) { Stop-Process -Id $proc.Id -Force }
          if (-not (Test-Path $frame) -or (Get-Item $frame).Length -lt 4000) {
            Write-Error 'the frozen window never drew a frame — nothing was released'
          }
          Write-Host "the frozen window drew a frame: $((Get-Item $frame).Length) bytes"
      - name: Upload the executables
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: out/*.exe

  build-linux:
    # The same two executables, built where the tests actually run. A monitoring box is
    # usually Linux, and "download a binary" beats "install a Python toolchain" on a
    # server that has neither an index nor an internet connection.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Qt system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-xinerama0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 || true
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[packaging,dev,desktop]"
      - name: Run the test suite before shipping anything
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build both executables
        run: |
          pyinstaller packaging/nocdeck-cli.spec
          pyinstaller packaging/nocdeck-desktop.spec
      - name: Rename the artifacts with the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cp dist/nocdeck "out/nocdeck-cli-${version}-linux-x86_64"
          cp dist/nocdeck-desktop "out/nocdeck-desktop-${version}-linux-x86_64"
      - name: Smoke-test both frozen binaries
        env:
          QT_QPA_PLATFORM: offscreen
          NOCDECK_HOME: ${{ runner.temp }}/nocdeck-linux-smoke
        run: |
          ./out/nocdeck-cli-*-linux-x86_64 version
          ./out/nocdeck-cli-*-linux-x86_64 list
          # A frozen window with no flags would open an empty window and wait; `--shot`
          # draws one frame and exits, which is the whole test. The `timeout` is the
          # second net: the binary has its own watchdog, and CI has this one.
          timeout 240 ./out/nocdeck-desktop-*-linux-x86_64 --demo --shot "$RUNNER_TEMP/frame.png" --size 3 --warmup 2
          test -s "$RUNNER_TEMP/frame.png"
      - name: Upload the executables
        uses: actions/upload-artifact@v4
        with:
          name: linux-executables
          path: out/*

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the executables
        uses: actions/download-artifact@v4
        with:
          pattern: "*-executables"
          merge-multiple: true
          path: out
      - name: Choose the release notes
        # Written notes if the release has them (`docs/releases/v0.1.1.md`), otherwise
        # whatever GitHub can generate from the commits. The REST API cannot update a
        # release by tag — only by id — so the notes have to be right the first time.
        shell: bash
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            echo "BODY_PATH=$notes" >> "$GITHUB_ENV"
            echo "using $notes"
          else
            echo "no $notes — GitHub will generate the notes"
          fi
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: ${{ env.BODY_PATH }}
          draft: false
          prerelease: false
          # `out/*`, not `out/*.exe`: the Linux binaries have no extension, and this
          # uploaded a Windows-only release the first time the tag was pushed.
          files: out/*
      - name: Announce on Telegram
        # A release created by a workflow with GITHUB_TOKEN does not trigger other
        # workflows (GitHub's anti-recursion rule), so the announcement cannot rely on
        # the `release: published` event for automated releases. It runs right here.
        # With no secrets set this prints a warning and changes nothing.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_LANG: ${{ vars.TELEGRAM_LANG || 'both' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/telegram/announce.py
